trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'adoadfconnection'
  subscriptionId: 'ee485719-86dd-43c5-ab00-4ae86ea6ffd5'
  resourceGroupName: 'rg-infy-terraform'
  dataFactoryName: 'mk-without-git'
  location: 'CentralIndia'
  keyVaultName: 'kv-infy-terraform'
  managedIdentityName: 'function-identity'

  armTemplateFile: 'mk-with-git/ARMTemplateForFactory.json'
  armParameterFile: 'parameters/testdr.parameters.json'

stages:

# -----------------------------------------------------
# DEPLOYMENT
# -----------------------------------------------------

- stage: DeployProd
  displayName: Deploy To Test DR
  jobs:
  - job: DeployADF
    steps:
    - checkout: self
    # -------------------------------
    # Stop Triggers
    # -------------------------------
    - task: AzurePowerShell@5
      displayName: Stop ADF Triggers
      inputs:
        azureSubscription: $(azureServiceConnection)
        ScriptType: InlineScript
        azurePowerShellVersion: LatestVersion
        Inline: |
          Import-Module Az.DataFactory -Force
          Set-AzContext -SubscriptionId "$(subscriptionId)"
         
          $triggers = Get-AzDataFactoryV2Trigger `
            -ResourceGroupName "$(resourceGroupName)" `
            -DataFactoryName "$(dataFactoryName)"
         
          if ($triggers.Count -eq 0) {
              Write-Host "No triggers found in $(dataFactoryName)"
          }
         
          foreach($trigger in $triggers)
          {
              if($trigger.RuntimeState -eq "Started")
              {
                  Stop-AzDataFactoryV2Trigger `
                    -ResourceGroupName "$(resourceGroupName)" `
                    -DataFactoryName "$(dataFactoryName)" `
                    -Name $trigger.Name `
                    -Force
                  Write-Host "Stopped Trigger: $($trigger.Name)"
              }
          }
       
    # -------------------------------
    # Deploy ARM
    # -------------------------------
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: Deploy ARM Template
      inputs:
        deploymentScope: Resource Group
        azureResourceManagerConnection: $(azureServiceConnection)
        subscriptionId: $(subscriptionId)
        action: Create Or Update Resource Group
        resourceGroupName: $(resourceGroupName)
        location: $(location)
        templateLocation: Linked artifact
        csmFile: $(armTemplateFile)
        csmParametersFile: $(armParameterFile)
        deploymentMode: Incremental
    # -------------------------------
    # Start Triggers
    # -------------------------------
    - task: AzurePowerShell@5
      displayName: Start ADF Triggers
      inputs:
        azureSubscription: $(azureServiceConnection)
        ScriptType: InlineScript
        azurePowerShellVersion: LatestVersion
        Inline: |
          Import-Module Az.DataFactory -Force
          Set-AzContext -SubscriptionId "$(subscriptionId)"
         
          $triggers = Get-AzDataFactoryV2Trigger `
            -ResourceGroupName "$(resourceGroupName)" `
            -DataFactoryName "$(dataFactoryName)"
         
          foreach($trigger in $triggers)
          {
              Start-AzDataFactoryV2Trigger `
                -ResourceGroupName "$(resourceGroupName)" `
                -DataFactoryName "$(dataFactoryName)" `
                -Name $trigger.Name `
                -Force
              Write-Host "Started Trigger: $($trigger.Name)"
          }

    # -------------------------------
    # Get Existing Managed Identity ID
    # -------------------------------
    - task: AzureCLI@2
      displayName: 'Get Existing Managed Identity ID'
      continueOnError: true
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Getting existing Managed Identity..."
    
          MI_ID=$(az identity show \
            --name "$(managedIdentityName)" \
            --resource-group "$(resourceGroupName)" \
            --query "id" \
            --output tsv)
    
          echo "Managed Identity Resource ID:"
          echo "$MI_ID"
    
          # Store for subsequent tasks
          echo "##vso[task.setvariable variable=managedIdentityId]$MI_ID"

    # -------------------------------
    # Get Existing ADF ID
    # -------------------------------
    - task: AzureCLI@2
      displayName: 'Get Existing ADF ID'
      continueOnError: true
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Getting existing Azure Data Factory..."
    
          ADF_ID=$(az datafactory show \
            --name "$(dataFactoryName)" \
            --resource-group "$(resourceGroupName)" \
            --query "id" \
            --output tsv)
    
          echo "ADF Resource ID:"
          echo "$ADF_ID"
    
          # Store for subsequent tasks
          echo "##vso[task.setvariable variable=adfId]$ADF_ID"
    
    # -------------------------------
    # Create Azure Key Vault Bash Script
    # -------------------------------
    - task: AzureCLI@2
      displayName: Create Azure Key Vault Bash Script
      continueOnError: true
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
            az keyvault create \
              --name "$(keyVaultName)" \
              --resource-group "$(resourceGroupName)" \
              --location "$(location)" \
              --subscription "$(subscriptionId)" \
              --enable-rbac-authorization true

    # -----------------------------------------------------
    # Create Key Vault ARM Template Deployment
    # -----------------------------------------------------
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: Create Key Vault ARM Template Deployment
      continueOnError: true
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: $(azureServiceConnection)
        subscriptionId: $(subscriptionId)
        action: 'Create Or Update Resource Group'
        resourceGroupName: $(resourceGroupName)
        location: $(location)
        templateLocation: 'Linked artifact'
        csmFile: 'templates/keyvault.json'
        overrideParameters: >
          -keyVaultName "$(keyVaultName)"
          -location "$(location)"
        deploymentMode: 'Incremental'
        deploymentName: 'Deploy-KeyVault'

     # -------------------------------
    # Delete Storage Account
    # -------------------------------
    - task: AzureCLI@2
      displayName: Delete Existing Storage Account - rginfyterraformab48
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          az storage account delete \
            --name "rginfyterraformab48" \
            --resource-group "$(resourceGroupName)" \
            --subscription "$(subscriptionId)" \
            --yes