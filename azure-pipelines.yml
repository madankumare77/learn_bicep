trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'adoadfconnection'
  subscriptionId: 'ee485719-86dd-43c5-ab00-4ae86ea6ffd5'
  resourceGroupName: 'rg-infy-terraform'
  dataFactoryName: 'mk-without-git'
  location: 'CentralIndia'
  keyVaultName: 'kv-infy-terraform'

  armTemplateFile: 'mk-with-git/ARMTemplateForFactory.json'
  armParameterFile: 'parameters/testdr.parameters.json'

stages:

# -----------------------------------------------------
# DEPLOYMENT
# -----------------------------------------------------

- stage: DeployProd
  displayName: Deploy To Test DR
  jobs:
  - job: DeployADF
    steps:
    - checkout: self
    # -------------------------------
    # Stop Triggers
    # -------------------------------
    - task: AzurePowerShell@5
      displayName: Stop ADF Triggers
      inputs:
        azureSubscription: $(azureServiceConnection)
        ScriptType: InlineScript
        azurePowerShellVersion: LatestVersion
        Inline: |
          Import-Module Az.DataFactory -Force
          Set-AzContext -SubscriptionId "$(subscriptionId)"
         
          $triggers = Get-AzDataFactoryV2Trigger `
            -ResourceGroupName "$(resourceGroupName)" `
            -DataFactoryName "$(dataFactoryName)"
         
          if ($triggers.Count -eq 0) {
              Write-Host "No triggers found in $(dataFactoryName)"
          }
         
          foreach($trigger in $triggers)
          {
              if($trigger.RuntimeState -eq "Started")
              {
                  Stop-AzDataFactoryV2Trigger `
                    -ResourceGroupName "$(resourceGroupName)" `
                    -DataFactoryName "$(dataFactoryName)" `
                    -Name $trigger.Name `
                    -Force
                  Write-Host "Stopped Trigger: $($trigger.Name)"
              }
          }
       
    # -------------------------------
    # Deploy ARM
    # -------------------------------
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: Deploy ARM Template
      inputs:
        deploymentScope: Resource Group
        azureResourceManagerConnection: $(azureServiceConnection)
        subscriptionId: $(subscriptionId)
        action: Create Or Update Resource Group
        resourceGroupName: $(resourceGroupName)
        location: $(location)
        templateLocation: Linked artifact
        csmFile: $(armTemplateFile)
        csmParametersFile: $(armParameterFile)
        deploymentMode: Incremental
    # -------------------------------
    # Start Triggers
    # -------------------------------
    - task: AzurePowerShell@5
      displayName: Start ADF Triggers
      inputs:
        azureSubscription: $(azureServiceConnection)
        ScriptType: InlineScript
        azurePowerShellVersion: LatestVersion
        Inline: |
          Import-Module Az.DataFactory -Force
          Set-AzContext -SubscriptionId "$(subscriptionId)"
         
          $triggers = Get-AzDataFactoryV2Trigger `
            -ResourceGroupName "$(resourceGroupName)" `
            -DataFactoryName "$(dataFactoryName)"
         
          foreach($trigger in $triggers)
          {
              Start-AzDataFactoryV2Trigger `
                -ResourceGroupName "$(resourceGroupName)" `
                -DataFactoryName "$(dataFactoryName)" `
                -Name $trigger.Name `
                -Force
              Write-Host "Started Trigger: $($trigger.Name)"
          }

    # -------------------------------
    # Create Azure Key Vault
    # -------------------------------
    - task: AzureCLI@2
      displayName: Create Azure Key Vault
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Checking whether Key Vault $(keyVaultName) exists..."

          if az keyvault show \
            --name "$(keyVaultName)" \
            --resource-group "$(resourceGroupName)" \
            --subscription "$(subscriptionId)" \
            > /dev/null 2>&1; then

            echo "Key Vault $(keyVaultName) already exists."
            echo "Skipping Key Vault creation."

          else

            echo "Key Vault $(keyVaultName) does not exist."
            echo "Creating Key Vault..."

            az keyvault create \
              --name "$(keyVaultName)" \
              --resource-group "$(resourceGroupName)" \
              --location "$(location)" \
              --subscription "$(subscriptionId)" \
              --enable-rbac-authorization true

            echo "Key Vault $(keyVaultName) created successfully."

          fi

    # -------------------------------
    # Verify Existing AKS Cluster
    # -------------------------------
    - task: AzureCLI@2
      displayName: Verify AKS Exists in Resource Group
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Checking for existing AKS clusters..."
          echo "Resource Group: $(resourceGroupName)"

          AKS_COUNT=$(az aks list \
            --resource-group "$(resourceGroupName)" \
            --subscription "$(subscriptionId)" \
            --query "length(@)" \
            --output tsv)

          if [ "$AKS_COUNT" -gt 0 ]; then

            echo "AKS cluster already exists in resource group $(resourceGroupName)."

            echo "Existing AKS cluster(s):"

            az aks list \
              --resource-group "$(resourceGroupName)" \
              --subscription "$(subscriptionId)" \
              --query "[].{Name:name, Location:location, KubernetesVersion:kubernetesVersion, ProvisioningState:provisioningState}" \
              --output table

          else

            echo "No AKS cluster exists in resource group $(resourceGroupName)."

          fi

    # -------------------------------
    # Delete Storage Account
    # -------------------------------
    - task: AzureCLI@2
      displayName: Delete Storage Account
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Checking storage account rginfyterraformab48..."

          STORAGE_EXISTS=$(az storage account check-name \
            --name "rginfyterraformab48" \
            --query "reason" \
            --output tsv)

          if az storage account show \
            --name "rginfyterraformab48" \
            --resource-group "$(resourceGroupName)" \
            --subscription "$(subscriptionId)" \
            > /dev/null 2>&1; then

            echo "Storage account rginfyterraformab48 exists."
            echo "Deleting storage account..."

            az storage account delete \
              --name "rginfyterraformab48" \
              --resource-group "$(resourceGroupName)" \
              --subscription "$(subscriptionId)" \
              --yes

            echo "Storage account rginfyterraformab48 deleted successfully."

          else

            echo "Storage account rginfyterraformab48 does not exist in $(resourceGroupName)."
            echo "Skipping deletion."

          fi